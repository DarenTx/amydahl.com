      alt="Family portrait in front of stone fireplace"

      src="/photos/PXL_20250726_210843387.jpg"

      class="medium-wide"
      src="/photos/IMG_6370-2-Edit.jpg"

      src="/photos/PXL_20210508_010005544.jpg"
